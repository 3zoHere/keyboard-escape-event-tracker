name: Roblox Events Monitor

"on":
  workflow_dispatch:

  schedule:
    - cron: "* * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Roblox Events Monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CONTROL_WEBHOOK: ${{ secrets.CONTROL_WEBHOOK }}
        run: |
          python main.py

      - name: Save state files
        run: |
          git config user.name "Roblox Events Bot"
          git config user.email "roblox-events-bot@users.noreply.github.com"

          git add events_state.json
          git add alerts_state.json
          git add stats_state.json
          git add control_state.json
          git add event_messages_state.json

          git diff --cached --quiet || git commit -m "Update bot state"

          git push
