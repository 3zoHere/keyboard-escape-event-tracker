name: Roblox Events Monitor

"on":
  workflow_dispatch:

  schedule:
    - cron: "* * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Roblox Events Monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CONTROL_WEBHOOK: ${{ secrets.CONTROL_WEBHOOK }}
        run: |
          python main.py

      - name: Save state files
        run: |
          git config user.name "Roblox Events Bot"
          git config user.email "roblox-events-bot@users.noreply.github.com"

          for file in \
            events_state.json \
            alerts_state.json \
            stats_state.json \
            control_state.json \
            event_messages_state.json
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update bot state"
            git push
          fi
